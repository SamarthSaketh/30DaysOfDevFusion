<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <div class="container my-4 text-center">
    <h1 class="display-5 fw-bold text-primary mb-4">Memory Card Game </h1>

    <div class="row justify-content-center mb-3">
      <div class="col-auto">
        <label for="difficulty" class="form-label fw-semibold">Difficulty:</label>
        <select id="difficulty" class="form-select">
          <option value="easy">Easy (4 pairs)</option>
          <option value="medium">Medium (8 pairs)</option>
          <option value="hard" selected>Hard (12 pairs)</option>
        </select>
      </div>

      <div class="col-auto d-flex align-items-end">
        <button id="show-all" class="btn btn-outline-primary me-2">Show All</button>
        <button id="shuffle" class="btn btn-outline-warning me-2">Shuffle</button>
        <button id="restart" class="btn btn-outline-danger">Restart</button>
      </div>
    </div>

    <div class="row justify-content-center mb-3">
      <div class="col-auto">
        <span class="badge bg-success fs-6 me-2" id="moves">Moves: 0</span>
        <span class="badge bg-info fs-6" id="timer">Time: 0s</span>
      </div>
    </div>

    <div id="game-board" class="board mx-auto"></div>


    <div id="message" class="mt-3 fs-5 fw-bold text-success"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
