<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 Sentiment Analysis</h1>
        <form method="POST">
            <textarea name="user_text" placeholder="Type your text here..." required>{{ request.form.user_text if request.method=='POST' else '' }}</textarea>
            <br>
            <button type="submit">Analyze</button>
        </form>

        {% if sentiment %}
            <div class="result">
                <p><strong>Sentiment:</strong> {{ sentiment }}</p>
                <p><strong>Confidence:</strong> {{ confidence }}%</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
