<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1e38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050d1f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9972a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8b84b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)" />

  <!-- Gold border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" ry="13"
        fill="none" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- "SS" initials -->
  <text
    x="32" y="44"
    font-family="Georgia, serif"
    font-size="30"
    font-weight="700"
    text-anchor="middle"
    fill="url(#textGrad)"
    letter-spacing="-1"
  >SS</text>

  <!-- Subtle gold underline accent -->
  <rect x="18" y="48" width="28" height="2" rx="1" fill="url(#textGrad)" opacity="0.5" />
</svg>
