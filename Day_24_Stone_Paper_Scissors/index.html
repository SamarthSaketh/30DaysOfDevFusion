<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🪨 Stone • 📄 Paper • ✂️ Scissors</h1>

  <div class="choices">
    <button onclick="play('stone')">
      <img src="https://cdn-icons-png.flaticon.com/512/6224/6224567.png" alt="Stone">
    </button>
    <button onclick="play('paper')">
      <img src="https://cdn-icons-png.flaticon.com/512/6558/6558596.png" alt="Paper">
    </button>
    <button onclick="play('scissors')">
      <img src="https://cdn-icons-png.flaticon.com/512/6347/6347076.png" alt="Scissors">
    </button>
  </div>

  <div id="result">
    <p>Make your move!</p>
  </div>

  <div id="scoreboard">
    <p>Wins: <span id="wins">0</span></p>
    <p>Losses: <span id="losses">0</span></p>
    <p>Draws: <span id="draws">0</span></p>
    <button onclick="resetScore()">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
