<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Daily Expenses </title>
</head>
<body>
    <div class="container">

        <form id="expense_form">
            <h1>Expense Tracker</h1>

            <div class="input-section">
                <label for="category_select">Category:</label>
                <select id="category_select" name="category_select" aria-label="Select a category">
                    <option value="" disabled selected>Select a category</option>
                    <option value="Payment">Payment</option>
                    <option value="Receipt">Receipt</option>
                </select>

                <label for="amount_input">Amount:</label>
                <input type="number" id="amount_input" name="amount_input" placeholder="Enter amount" aria-label="Enter amount">

                <label for="info">Info:</label>
                <input type="text" id="info" name="info" placeholder="Enter a description (optional)" aria-label="Enter description">

                <label for="date_input">Date:</label>
                <input type="date" id="date_input" name="date_input" aria-label="Select date">

                <button type="button" id="add_btn">Add Expense</button>
            </div>

            <div id="opening_balance_section" class="input-section">
                <label for="opening_balance">Opening Balance:</label>
                <input type="number" id="opening_balance" placeholder="Enter opening balance" aria-label="Enter opening balance">
                <button type="button" id="set_opening_balance_btn">Set Balance</button>
            </div>
        </form>

        <div class="filters">
            <div class="filter-group">
                <input type="text" id="search_input" placeholder="Search by info..." aria-label="Search by info">
                <label for="month_select">Month:</label>
                <select id="month_select" aria-label="Select month for filter">
                <option value="">Select Month</option>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
                </select>

                <label for="year_select">Year:</label>
                <select id="year_select" aria-label="Select year for filter"></select>

                <label for="from_date">From:</label>
                <input type="date" id="from_date" aria-label="Filter from date">

                <label for="to_date">To:</label>
                <input type="date" id="to_date" aria-label="Filter to date">
            </div>

            <div class="button-group">
                <button type="button" id="filter_date_btn">Filter by Date</button>
                <button type="button" id="reset_filter_btn">Reset</button>
                <button type="button" id="export_excel_btn">Export to Excel</button>
                <button type="button" id="sort_date_btn">Sort by Date</button>
            </div>
        </div>

        

        <div class="expenses-list">
            <h2>Transactions</h2>
           <table id="resizable-table" aria-label="Transactions Table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Info</th>
                        <th>Receipt</th>
                        <th>Payment</th>
                        <th>Balance Amount</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="expense-table-body">
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" aria-label="Total Balance Label">Total Balance:</td>
                        <td id="total-amount" aria-label="Total Balance Value"></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
