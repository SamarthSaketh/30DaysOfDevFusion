<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-Tac-Toe AI</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body class="pvp">
  <div class="game-container">
    <h1 id="status">Player X's turn</h1>
    <div class="board" id="board"></div>
    <div class="controls">
      <button id="modeToggleBtn">Switch to Computer Mode</button>
      <button id="restartBtn">Restart Game</button>
    </div>
  </div>

  <div id="aiActivateLayer" aria-hidden="true">
    <div id="gridLines"></div>
    <div id="glitchText" aria-live="polite" aria-atomic="true">Computer Mode Activating...</div>
  </div>
</body>
</html>
